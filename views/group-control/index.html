<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊控制</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">QQ · 每群独立设置</p><h1>群聊控制</h1>
        <p class="subtitle">统一管理发言权限、总回复额度、读空气回复额度和生图。</p></div>
      <div class="header-actions"><button id="refresh-usage" class="secondary" disabled>刷新用量</button><button id="refresh" class="secondary" disabled>刷新群列表</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite">正在连接 AstrBot…</div>
    <section class="quota-guide" aria-label="额度说明">
      <div><strong>总回复额度</strong><span>包括直接 @和主动接话。关闭即不限总次数。</span></div>
      <div><strong>读空气回复额度</strong><span>限制未直接 @的主动接话。直接 @不计入此额度。</span></div>
      <p>一次回答分多段发送，仍算 1 轮。次数按滑动窗口统计；主人管理指令豁免，群禁言仍优先。</p>
    </section>
    <section class="board" aria-label="群聊开关">
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索群名、群号或平台" aria-label="搜索群聊">
        <span id="count" class="muted"></span>
      </div>
      <div class="batch">
        <label><input id="select-all" type="checkbox"> 选择当前列表</label>
        <span class="spacer"></span>
        <button id="enable-selected" class="secondary" disabled>开启选中</button>
        <button id="disable-selected" class="secondary" disabled>关闭选中</button>
      </div>
      <div id="groups" aria-live="polite"></div>
    </section>
    <details id="add-group-details">
      <summary>添加群号</summary>
      <p class="muted">未出现在群列表中的群，也可以先登记开关。</p>
      <form id="add-group">
        <select id="platform" aria-label="QQ 平台" required></select>
        <input id="group-id" inputmode="numeric" pattern="[1-9][0-9]{4,15}" placeholder="群号" aria-label="群号" required>
        <button type="submit" id="add-button" class="secondary" disabled>添加并关闭</button>
      </form>
    </details>
    <p class="footnote">发言总开关关闭后，主人、@、关键词均不例外。额度设置持久保存，回复计数在插件重载或 AstrBot 重启后重新统计。</p>
    <noscript>请启用 JavaScript，并在 AstrBot 的插件视图中打开此页面。</noscript>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
